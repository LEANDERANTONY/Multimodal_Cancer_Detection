[project]
name = "multimodal-cancer-detection"
version = "0.1.0"
description = "Multimodal pancreatic cancer detection workflows, reports, and notebook-driven experiments."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "SimpleITK>=2.4",
    "nibabel>=5.3",
    "pydicom>=3.0",
    "pillow>=11.0",
    "opencv-python>=4.10",
    "imbalanced-learn>=0.13",
    "statsmodels>=0.14.4",
    "torch>=2.9,<2.10",
    "torchvision>=0.24,<0.25",
    "albumentations>=2.0",
    "scikit-image>=0.24",
    "notebook>=7.2",
    "ipykernel>=6.29",
    "pytest>=8.3",
]

[tool.uv]
package = false

# CUDA 12.8 wheels are required on Windows for Blackwell / RTX 50-series GPUs
# (compute capability sm_120), which the default PyPI Windows wheels (CPU-only)
# do not support. Scoped to win32 so Linux CI keeps resolving from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
